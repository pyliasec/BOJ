name: Update README

permissions:
  contents: write  # <-- push 할 수 있도록 권한 부여

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # 기본 제공 토큰 사용

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install datetime requests tqdm

      - name: Run script
        run: |
          python scripts/update_readme.py
          if [ $? -eq 123 ]; then
            exit 0
          fi
      
      - name: Push changes and commit
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git commit -am "Update README.md" || echo "No changes to commit"
          git push
